    const INITIAL_EXAM_ATTEMPTS = [

      { ID: 'EVAL001', CourseID: 'C101', TeacherID: 'T101', TeacherName: 'ครูสมศักดิ์ สุขใจ', StudentID: '04501', Clarity: '5', Engagement: '5', Materials: '4', Assessment: '5', Counseling: '5', OverallScore: '4.8', Comment: 'ครูสอนสนุก เข้าใจง่าย มีตัวอย่างประกอบชัดเจนครับ', SubmittedAt: '2026-05-20 16:00' }
    ];

    // Helper: Embed URL Parser for Video Streaming
    const getEmbedUrl = (url) => {
      if (!url) return null;
      // YouTube
      const ytMatch = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
      if (ytMatch && ytMatch[1]) return `https://www.youtube.com/embed/${ytMatch[1]}`;
      // Google Drive Preview
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      return null;
    };

    // Helper: Convert File to Base64
    const fileToBase64 = (file) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          base64: reader.result,
          name: file.name,
          mimeType: file.type || 'application/octet-stream',
          size: file.size
        });
        reader.onerror = error => reject(error);
      });
    };

    // Helper: Lenient StudentID comparison (handles Google Sheets stripping leading zeros e.g. '04501' vs '4501')
    const isSameStudentId = (idA, idB) => {
      const a = String(idA || '').trim();
      const b = String(idB || '').trim();
      if (!a || !b) return false;
      return a === b || a.replace(/^0+/, '') === b.replace(/^0+/, '');
    };

    // --- Main Application Component ---
    function EduPortalApp() {
      const [gasUrl, setGasUrl] = useState(() => {

      const [isSyncing, setIsSyncing] = useState(false);

      });

      const [db, setDb] = useState(() => {
        try {
          const cached = localStorage.getItem('eduportal_db_cache');
          if (cached) return JSON.parse(cached);

        return {
          Settings: INITIAL_SETTINGS,

          Students: INITIAL_STUDENTS,
          Courses: INITIAL_COURSES,

          Submissions: INITIAL_SUBMISSIONS,

          ExamAttempts: INITIAL_EXAM_ATTEMPTS,
          Evaluations: INITIAL_EVALUATIONS

      });

      useEffect(() => {
        localStorage.setItem('eduportal_db_cache', JSON.stringify(db));
      }, [db]);

      useEffect(() => {
        if (gasUrl) {
          localStorage.setItem('eduportal_gas_url', gasUrl);
        }
      }, [gasUrl]);

      // Auto-fetch database from GAS when URL is provided
      useEffect(() => {
        const autoFetch = async () => {
          if (!gasUrl || !gasUrl.startsWith('https://script.google.com/')) return;
          setIsSyncing(true);
          try {
            const response = await fetch(gasUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'pullAll', payload: {} })
            });
            const data = await response.json();
            if (data.status === 'success' && data.result && data.result.data) {
              const remote = data.result.data;
              setDb(prev => {
                const next = { ...prev };
                Object.keys(remote).forEach(k => {
                  if (Array.isArray(remote[k]) && remote[k].length > 0) {
                    next[k] = remote[k];
                  }
                });
                return next;
              });
            }
          } catch (err) {
            console.warn('Auto-sync skipped:', err);
          } finally {
            setIsSyncing(false);
          }
        };
        autoFetch();
      }, [gasUrl]);

      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('eduportal_current_user', JSON.stringify(currentUser));

        return null;
      }, [db.Settings]);

            sessionStorage.setItem('eduportal_seen_announcement', 'true');

          Swal.fire({
            icon: 'warning',
            title: 'ยังไม่ได้ระบุ GAS Web App URL',
            text: 'ระบบทำงานในโหมด Local Cache คุณสามารถใส่ Web App URL ในแถบควบคุมด้านบนเพื่อซิงค์ข้อมูลกับ Google Sheets จริง',
            confirmButtonColor: '#4f46e5'
          });
          return null;
        }

        setIsSyncing(true);
        try {
          const response = await fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action, payload })
          });
          const data = await response.json();
          if (data.status === 'error') throw new Error(data.message || 'API error');
          return data.result;
        } catch (error) {
          console.error('GAS API Call failed:', error);
          Swal.fire({
            icon: 'error',
            title: 'การเชื่อมต่อผิดพลาด',
            text: error.message || 'ไม่สามารถติดต่อ Google Apps Script ได้ โปรดตรวจสอบสิทธิ์การแชร์ Web App (Anyone)',
            confirmButtonColor: '#ef4444'
          });
          return null;
        } finally {
          setIsSyncing(false);
        }
      };

      const handlePingGAS = async () => {
        Swal.fire({
          title: 'กำลังทดสอบการเชื่อมต่อ...',

        if (res && res.success) {

      const handleSetupDatabase = async () => {
        const confirm = await Swal.fire({
          title: 'สร้างและจัดระเบียบ 10 ชีต?',

          const res = await callGasApi('setup');

          setDb(prev => ({ ...prev, ...res.data }));

      const handlePushData = async () => {

          title: 'ส่งข้อมูลขึ้น Sheets ทั้งหมด?',

        if (confirm.isConfirmed) {
          Swal.fire({ title: 'กำลังส่งข้อมูล...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
          const res = await callGasApi('pushAll', db);
          if (res && res.success) {
            Swal.fire({ icon: 'success', title: 'ส่งข้อมูลสำเร็จ!', text: 'ข้อมูลทั้งหมดถูกบันทึกลง Google Sheets แล้ว', confirmButtonColor: '#4f46e5' });
          }
        }
      };

      // Generalized Record Saver with immediate Local Cache & remote sync
      const saveRecordToSheet = async (sheetName, recordData) => {
        const idKey = ID_KEYS[sheetName] || 'ID';
        setDb(prev => {
          const table = prev[sheetName] || [];
          const idx = table.findIndex(item => item[idKey] === recordData[idKey]);
          let updated;
          if (idx >= 0) {
            updated = [...table];
            updated[idx] = { ...updated[idx], ...recordData };
          } else {
            updated = [...table, recordData];
          }
          return { ...prev, [sheetName]: updated };
        });

        if (gasUrl) {
          await callGasApi('saveRecord', { sheetName, data: recordData });
        }
      };

      // Generalized Record Deleter
      const deleteRecordFromSheet = async (sheetName, primaryValue) => {
        const idKey = ID_KEYS[sheetName] || 'ID';
        setDb(prev => {
          const table = prev[sheetName] || [];
          return { ...prev, [sheetName]: table.filter(item => item[idKey] !== primaryValue) };
        });

        if (gasUrl) {
          await callGasApi('deleteRecord', { sheetName, primaryValue });
        }
      };

      // Filtered courses based on current user role (MUST be declared before early return to obey Rules of Hooks)
      const visibleCourses = useMemo(() => {
        if (!currentUser) return [];
        if (currentUser.role === 'admin') return db.Courses || [];
        if (currentUser.role === 'teacher') {
          return (db.Courses || []).filter(c => c.TeacherID === currentUser.user.TeacherID);
        }

          const allowedStr = currentUser.user.AllowedCourses || '';
          if (!allowedStr || allowedStr === '*' || allowedStr.trim() === '') return db.Courses || [];
          const allowedList = allowedStr.split(',').map(s => s.trim().toUpperCase());
          return (db.Courses || []).filter(c => allowedList.includes(String(c.CourseID).toUpperCase()) || allowedList.includes(String(c.Code).toUpperCase()));
        }
        return [];
      }, [db.Courses, currentUser]);

      // Check if user is logged in
      if (!currentUser) {

              <div className="text-center mb-8">

              }).then((result) => {
                if (result.isConfirmed) {
                  setCurrentUser(null);
                  setShowMobileProfile(false);
                  sessionStorage.removeItem('eduportal_seen_announcement');

                  title: 'ต้องการออกจากระบบ?',

                  showCancelButton: true,
                  confirmButtonText: 'ออกจากระบบ',
                  cancelButtonText: 'ยกเลิก',
                  confirmButtonColor: '#ef4444'
                }).then((result) => {
                  if (result.isConfirmed) {
                    setCurrentUser(null);
                    sessionStorage.removeItem('eduportal_seen_announcement');
                  }
                });
              }}
            />

          {/* Main Content Workspace (pb-24 on mobile for fixed bottom nav) */}

            {selectedCourse ? (
              <CourseDetailView
                course={selectedCourse}
                db={db}
                currentUser={currentUser}
                gasUrl={gasUrl}
                callGasApi={callGasApi}
                courseTab={courseTab}
                setCourseTab={setCourseTab}
                onBack={() => setSelectedCourseId(null)}
                onSaveRecord={saveRecordToSheet}

                  <StudentsManagementView
                    students={db.Students || []}
                    courses={db.Courses || []}

                    onDeleteStudent={(id) => deleteRecordFromSheet('Students', id)}

                      setDb(prev => {
                        const existing = prev.Students || [];
                        const map = new Map(existing.map(s => [s.StudentID, s]));

                      });
                    }}

                )}

                  <TeachersManagementView 
                    teachers={db.Teachers || []}
                    onSaveTeacher={(t) => saveRecordToSheet('Teachers', t)}
                    onDeleteTeacher={(id) => deleteRecordFromSheet('Teachers', id)}
                  />
                )}

                {currentTab === 'announcements' && (
                  <AnnouncementsView
                    settings={db.Settings || []}
                    currentUser={currentUser}
                    onSaveAnnouncement={(updatedAnn) => {
                      const record = {
                        SettingKey: 'Announcement',
                        SettingValueJSON: JSON.stringify(updatedAnn),
                        UpdatedAt: new Date().toISOString()
                      };
                      saveRecordToSheet('Settings', record);
                      Swal.fire({ icon: 'success', title: 'บันทึกประกาศสำเร็จ', timer: 1500, showConfirmButton: false });
                    }}
                  />
                )}

                {currentTab === 'settings' && currentUser.role === 'admin' && (
                  <SettingsView 
                    settings={db.Settings || []} 
                    gasUrl={gasUrl}
                    setGasUrl={setGasUrl}
                    onPing={handlePingGAS}
                    onSetup={handleSetupDatabase}
                    onPull={handlePullData}
                    onPush={handlePushData}
                    onSaveSetting={(st) => saveRecordToSheet('Settings', st)} 
                  />
                )}
              </div>
            )}
          </main>

          {/* Mobile Fixed Bottom Navigation Bar */}
          <MobileBottomNav
            currentUser={currentUser}
            currentTab={currentTab}
            setCurrentTab={(tab) => { setSelectedCourseId(null); setCurrentTab(tab); }}
            selectedCourse={selectedCourse}
            onBackFromCourse={() => setSelectedCourseId(null)}
            courseTab={courseTab}
            setCourseTab={setCourseTab}
            db={db}
            onOpenProfile={() => setShowMobileProfile(true)}
          />
        </div>
      );
    }

    // --- Navigation Header Component ---
    function Navbar({ currentUser, currentTab, isSyncing, onRefresh, onOpenProfile, setCurrentTab, onLogout }) {
      const getRoleBadge = (role) => {
        if (role === 'admin') return <span className="bg-rose-100 text-rose-700 font-semibold px-2.5 py-0.5 rounded-full text-[11px]">ผู้ดูแลระบบ</span>;

        return (db.ExamAttempts || []).filter(ea => ea.CourseID === course.CourseID);

                  <span className="text-[11px] text-white/80 font-medium">บทเรียนในวิชา</span>

    // --- Module 1: Lessons & Learning Materials ---
    function LessonsView({ course, lessons, currentUser, onSaveLesson, onDeleteLesson }) {

      const [showModal, setShowModal] = useState(false);
      const [editingLesson, setEditingLesson] = useState(null);

      const visibleLessons = currentUser.role === 'student'
        ? lessons.filter(l => String(l.Published) !== 'false')
        : lessons;

      const handleOpenAdd = () => {
        setEditingLesson({
          LessonID: 'L' + Date.now().toString().slice(-4),
          CourseID: course.CourseID,
          Title: '',
          Description: '',
          VideoURL: '',
          AttachmentsJSON: JSON.stringify([]),
          Order: String(lessons.length + 1),
          Published: 'true',
          CreatedAt: new Date().toISOString().split('T')[0]
        });
        setShowModal(true);
      };

      const handleOpenEdit = (l) => {
        setEditingLesson({ ...l });
        setShowModal(true);
      };

      const handleDelete = (id) => {
        Swal.fire({
          title: 'ลบบทเรียนนี้?',
          text: 'เนื้อหาและวิดีโอในบทเรียนนี้จะถูกนำออก',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ลบบทเรียน',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((result) => {
          if (result.isConfirmed) {
            onDeleteLesson(id);
            Swal.fire({ icon: 'success', title: 'ลบบทเรียนเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleTogglePublish = (lesson) => {
        const nextPub = String(lesson.Published) === 'false' ? 'true' : 'false';
        onSaveLesson({ ...lesson, Published: nextPub });
        Swal.fire({
          icon: 'success',
          title: nextPub === 'true' ? 'เผยแพร่บทเรียนแล้ว' : 'ซ่อนบทเรียนแล้ว',
          timer: 1000,
          showConfirmButton: false
        });
      };

      const handleSaveSubmit = (e) => {
        e.preventDefault();
        onSaveLesson(editingLesson);
        setShowModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกบทเรียนสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-xl font-bold text-slate-900">บทเรียนและสื่อการสอน (Lessons)</h2>
              <p className="text-xs text-slate-500">วิดีโอบรรยาย เอกสาร PDF และเนื้อหาการเรียนรู้ประจำรายวิชา</p>
            </div>

            {(currentUser.role === 'admin' || currentUser.role === 'teacher') && (
              <button
                onClick={handleOpenAdd}
                className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
              >
                <Icon name="Plus" size={16} />
                <span>เพิ่มบทเรียนใหม่</span>
              </button>

          </div>

          {visibleLessons.length === 0 ? (
            <div className="bg-white rounded-3xl p-12 text-center border border-slate-200">
              <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mx-auto mb-2">
                <Icon name="BookOpen" size={24} />
              </div>
              <p className="text-sm font-bold text-slate-600">ยังไม่มีบทเรียนในรายวิชานี้</p>
            </div>
          ) : (
            <div className="space-y-4">
              {visibleLessons.map(lesson => {
                const isPublished = String(lesson.Published) !== 'false';
                let attachments = [];
                try { attachments = JSON.parse(lesson.AttachmentsJSON || '[]'); } catch { attachments = []; }
                const embedUrl = getEmbedUrl(lesson.VideoURL);

                return (
                  <div key={lesson.LessonID} className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div className="flex items-start gap-3">
                        <span className="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 font-bold text-xs flex items-center justify-center shrink-0 border border-indigo-100">
                          {lesson.Order || '1'}
                        </span>
                        <div>
                          <div className="flex items-center gap-2 flex-wrap">
                            <h3 className="font-bold text-base text-slate-900">{lesson.Title}</h3>
                            {currentUser.role !== 'student' && (
                              <span className={`px-2 py-0.5 rounded text-[11px] font-semibold ${isPublished ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-500'}`}>
                                {isPublished ? 'เผยแพร่แล้ว' : 'ซ่อนอยู่'}

                          </div>
                          <p className="text-slate-600 text-sm mt-1 whitespace-pre-line leading-relaxed">
                            {lesson.Description}
                          </p>
                        </div>
                      </div>

                      {currentUser.role !== 'student' && (
                        <div className="flex items-center gap-1.5 shrink-0">
                          <button
                            onClick={() => handleTogglePublish(lesson)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                              isPublished ? 'bg-slate-50 text-slate-600 hover:bg-slate-100 border-slate-200' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border-emerald-200'
                            }`}
                          >
                            {isPublished ? 'ซ่อนบทเรียน' : 'เปิดเผยแพร่'}
                          </button>
                          <button
                            onClick={() => handleOpenEdit(lesson)}
                            className="p-1.5 hover:bg-slate-100 rounded-lg text-slate-500 hover:text-slate-700"
                            title="แก้ไขบทเรียน"
                          >
                            <Icon name="Edit" size={16} />
                          </button>
                          <button
                            onClick={() => handleDelete(lesson.LessonID)}
                            className="p-1.5 hover:bg-rose-50 rounded-lg text-slate-400 hover:text-rose-600"
                            title="ลบบทเรียน"
                          >
                            <Icon name="Trash2" size={16} />
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Media Actions & Embeds */}
                    <div className="pt-2 flex flex-wrap items-center gap-2">
                      {lesson.VideoURL && (
                        <button
                          onClick={() => setActiveVideoId(activeVideoId === lesson.LessonID ? null : lesson.LessonID)}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2 transition ${
                            activeVideoId === lesson.LessonID 
                              ? 'bg-rose-600 text-white' 
                              : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700'
                          }`}
                        >
                          <Icon name="Video" size={15} />
                          <span>{activeVideoId === lesson.LessonID ? 'ปิดหน้าต่างวิดีโอ' : 'รับชมวิดีโอบรรยาย'}</span>
                        </button>
                      )}

                      {attachments.map((att, aIdx) => (
                        <a
                          key={aIdx}
                          href={att.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition"
                        >
                          <Icon name="Paperclip" size={13} />
                          <span>{att.title || 'เอกสารประกอบ'}</span>
                          <Icon name="ExternalLink" size={12} className="text-slate-400" />
                        </a>
                      ))}
                    </div>

                    {/* Embedded Video Player */}
                    {activeVideoId === lesson.LessonID && (
                      <div className="pt-3">
                        {embedUrl ? (
                          <div className="w-full aspect-video rounded-2xl overflow-hidden shadow-inner border border-slate-200 bg-black">
                            <iframe
                              src={embedUrl}
                              className="w-full h-full"
                              title={lesson.Title}
                              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                              allowFullScreen
                            ></iframe>
                          </div>
                        ) : (
                          <div className="p-4 bg-amber-50 text-amber-800 text-xs rounded-xl border border-amber-200 flex items-center gap-2">
                            <Icon name="AlertCircle" size={16} />
                            <span>ไม่สามารถแปลงลิงก์วิดีโอเพื่อฝังเล่นในเว็บได้: <a href={lesson.VideoURL} target="_blank" rel="noreferrer" className="underline font-bold">คลิกเปิดในแท็บใหม่</a></span>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Modal Add/Edit Lesson */}
          {showModal && editingLesson && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-lg font-bold text-slate-900">
                    {lessons.some(l => l.LessonID === editingLesson.LessonID) ? 'แก้ไขบทเรียน' : 'เพิ่มบทเรียนใหม่'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={20} />

                    <div className="col-span-1">
                      <label className="block text-xs font-bold text-slate-700 mb-1">ลำดับที่</label>
                      <input
                        type="number"
                        required
                        value={editingLesson.Order}
                        onChange={(e) => setEditingLesson({ ...editingLesson, Order: e.target.value })}

                      />

                    <div className="col-span-3">
                      <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อบทเรียน</label>
                      <input
                        type="text"
                        required
                        value={editingLesson.Title}
                        onChange={(e) => setEditingLesson({ ...editingLesson, Title: e.target.value })}
                        placeholder="เช่น บทที่ 1: การประมวลผลข้อมูล"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">รายละเอียด / วัตถุประสงค์การเรียนรู้</label>
                    <textarea
                      rows={3}
                      value={editingLesson.Description}
                      onChange={(e) => setEditingLesson({ ...editingLesson, Description: e.target.value })}
                      placeholder="อธิบายเนื้อหาและสิ่งที่นักเรียนจะได้เรียนรู้..."
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ลิงก์วิดีโอ (YouTube หรือ Google Drive Stream)</label>

                      type="url"
                      value={editingLesson.VideoURL}

                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 font-mono text-xs"
                    />
                  </div>

                  <div className="flex items-center gap-2">
                    <input
                      type="checkbox"
                      id="lesson_pub"

      const handleOpenAdd = () => {
        setEditingAssignment({
          AssignmentID: 'A' + Date.now().toString().slice(-4),
          CourseID: course.CourseID,
          Title: '',
          Description: '',
          MaxScore: '10',
          DueDate: new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 16),
          AttachmentsJSON: '[]',
          CreatedAt: new Date().toISOString().split('T')[0]
        });
        setShowAddModal(true);
      };

      const handleDelete = (id) => {
        Swal.fire({
          title: 'ลบการบ้านนี้?',
          text: 'ข้อมูลการส่งงานของนักเรียนทั้งหมดจะถูกลบไปด้วย',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ยืนยันการลบ',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((result) => {
          if (result.isConfirmed) {
            onDeleteAssignment(id);
            Swal.fire({ icon: 'success', title: 'ลบการบ้านเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleSaveAssignmentSubmit = (e) => {
        e.preventDefault();
        onSaveAssignment(editingAssignment);
        setShowAddModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกการบ้านสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      // Student submits file & note -> uploads to Google Drive via GAS
      const handleStudentSubmit = async (assignment) => {
        if (!uploadFile && !studentNote.trim()) {
          Swal.fire({
            icon: 'warning',
            title: 'กรุณาแนบไฟล์หรือเขียนข้อความ',
            text: 'โปรดเลือกไฟล์งานที่จะส่งหรือพิมพ์ข้อความถึงครู',
            confirmButtonColor: '#4f46e5'
          });
          return;
        }

        setIsUploading(true);
        Swal.fire({
          title: 'กำลังอัปโหลดไฟล์ส่งงาน...',
          text: 'แปลงไฟล์และส่งเข้าสู่ Google Drive ของโรงเรียน',
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });

        try {
          let fileData = null;
          if (uploadFile) {
            fileData = await fileToBase64(uploadFile);
          }

          const existingSub = submissions.find(
            s => s.AssignmentID === assignment.AssignmentID && isSameStudentId(s.StudentID, currentUser.user.StudentID)
          );

          const submissionPayload = {
            ID: existingSub?.ID || ('SUB_' + Date.now().toString().slice(-6)),
            AssignmentID: assignment.AssignmentID,
            CourseID: course.CourseID,
            StudentID: currentUser.user.StudentID,
            StudentName: currentUser.user.Name,
            Grade: currentUser.user.Grade || '',
            FileName: uploadFile ? uploadFile.name : (existingSub?.FileName || ''),
            FileUrl: existingSub?.FileUrl || '',
            DriveFileID: existingSub?.DriveFileID || '',
            Note: studentNote,
            SubmittedAt: new Date().toLocaleString('th-TH'),
            Score: existingSub?.Score || '',
            Feedback: existingSub?.Feedback || '',
            Status: 'Submitted'
          };

          if (gasUrl) {
            const res = await callGasApi('submitAssignment', {
              submission: submissionPayload,
              fileData: fileData
            });

            if (res && res.result && res.result.isNew !== undefined) {
              // updated
              if (res.file) {
                submissionPayload.FileUrl = res.file.fileUrl;
                submissionPayload.DriveFileID = res.file.driveFileId;
              }
            }
          } else {
            // Local fallback simulation
            if (uploadFile) {
              submissionPayload.FileUrl = 'https://placehold.co/800x600/e0e7ff/4f46e5?text=' + encodeURIComponent(uploadFile.name);
            }
          }

          onSaveSubmission(submissionPayload);
          setSubmittingAssignId(null);
          setUploadFile(null);
          setStudentNote('');

          Swal.fire({
            icon: 'success',
            title: 'ส่งงานเรียบร้อยแล้ว!',
            text: 'ไฟล์ของคุณถูกบันทึกเข้า Google Drive และตารางเรียบร้อย',
            confirmButtonColor: '#4f46e5'
          });
        } catch (error) {
          console.error(error);
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาดในการส่งงาน',
            text: error.message || 'ไม่สามารถอัปโหลดไฟล์ได้',
            confirmButtonColor: '#ef4444'
          });
        } finally {
          setIsUploading(false);
        }
      };

      // Teacher grades submission
      const handleGradingSubmit = (e) => {
        e.preventDefault();
        const scoreNum = parseFloat(scoreInput);
        const maxScoreNum = parseFloat(viewingAssignmentSubmissions?.MaxScore || 10);

        if (isNaN(scoreNum) || scoreNum < 0 || scoreNum > maxScoreNum) {
          Swal.fire({
            icon: 'warning',
            title: 'คะแนนไม่ถูกต้อง',
            text: `กรุณากรอกคะแนนระหว่าง 0 ถึง ${maxScoreNum}`,
            confirmButtonColor: '#4f46e5'
          });
          return;
        }

        const updatedSub = {
          ...gradingSubmission,
          Score: String(scoreNum),
          Feedback: feedbackInput.trim(),
          Status: 'Graded'
        };

        onSaveSubmission(updatedSub);
        setGradingSubmission(null);
        Swal.fire({ icon: 'success', title: 'บันทึกคะแนนและคำติชมสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-xl font-bold text-slate-900">การบ้านและใบงาน (Assignments)</h2>
              <p className="text-xs text-slate-500">มอบหมายงาน ตรวจสอบการส่งงาน และอัปโหลดไฟล์ตรงสู่ Google Drive</p>
            </div>

            {(currentUser.role === 'admin' || currentUser.role === 'teacher') && (
              <button
                onClick={handleOpenAdd}
                className="inline-flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
              >
                <Icon name="Plus" size={16} />
                <span>สร้างการบ้านใหม่</span>
              </button>
            )}
          </div>

          {assignments.length === 0 ? (
            <div className="bg-white rounded-3xl p-12 text-center border border-slate-200">
              <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 mx-auto mb-2">
                <Icon name="FileText" size={24} />
              </div>
              <p className="text-sm font-bold text-slate-600">ยังไม่มีการบ้านที่มอบหมายในวิชานี้</p>
            </div>
          ) : (
            <div className="space-y-4">
              {assignments.map(assign => {
                const assignSubs = submissions.filter(s => s.AssignmentID === assign.AssignmentID);
                const mySubmission = currentUser.role === 'student' 
                  ? assignSubs.find(s => isSameStudentId(s.StudentID, currentUser.user.StudentID))
                  : null;

                const isOverdue = assign.DueDate && new Date(assign.DueDate) < new Date();

                return (
                  <div key={assign.AssignmentID} className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                    <div className="flex flex-wrap items-start justify-between gap-3">
                      <div>
                        <div className="flex items-center gap-2 flex-wrap">
                          <h3 className="font-bold text-base text-slate-900">{assign.Title}</h3>
                          <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100">
                            คะแนนเต็ม {assign.MaxScore || '10'} คะแนน
                          </span>
                          {assign.DueDate && (
                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-medium flex items-center gap-1 ${
                              isOverdue ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-slate-100 text-slate-600'
                            }`}>
                              <Icon name="Clock" size={12} />
                              <span>ครบกำหนด: {new Date(assign.DueDate).toLocaleString('th-TH')}</span>
                            </span>
                          )}
                        </div>

                        <p className="text-slate-600 text-sm mt-2 whitespace-pre-line leading-relaxed">
                          {assign.Description}
                        </p>
                      </div>

                      {currentUser.role !== 'student' ? (
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setViewingAssignmentSubmissions(assign)}
                            className="px-3.5 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition"
                          >
                            <Icon name="CheckCircle" size={15} />
                            <span>ตรวจงาน ({assignSubs.length} คน)</span>
                          </button>
                          <button
                            onClick={() => handleDelete(assign.AssignmentID)}
                            className="p-1.5 hover:bg-rose-50 rounded-lg text-slate-400 hover:text-rose-600"
                            title="ลบการบ้าน"
                          >
                            <Icon name="Trash2" size={16} />
                          </button>
                        </div>
                      ) : (
                        <div>
                          {mySubmission ? (
                            <div className="text-right">
                              <span className={`px-3 py-1 rounded-full text-xs font-bold inline-block ${
                                mySubmission.Status === 'Graded' 
                                  ? 'bg-emerald-100 text-emerald-800' 
                                  : 'bg-amber-100 text-amber-800'
                              }`}>
                                {mySubmission.Status === 'Graded' ? `ตรวจแล้ว: ${mySubmission.Score}/${assign.MaxScore} คะแนน` : 'ส่งแล้ว (รอตรวจ)'}
                              </span>
                            </div>
                          ) : (
                            <button
                              onClick={() => { setSubmittingAssignId(assign.AssignmentID); setStudentNote(''); setUploadFile(null); }}
                              className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1.5"
                            >
                              <Icon name="UploadCloud" size={16} />
                              <span>ส่งงาน</span>
                            </button>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Student View: Submission Status Card */}
                    {currentUser.role === 'student' && mySubmission && (
                      <div className="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-xs space-y-2">
                        <div className="flex flex-wrap items-center justify-between gap-2">
                          <span className="font-bold text-slate-700">ประวัติการส่งงานของคุณ:</span>
                          <span className="text-slate-400">ส่งเมื่อ: {mySubmission.SubmittedAt}</span>
                        </div>

                        {mySubmission.FileName && (
                          <div className="flex items-center gap-2">
                            <Icon name="Paperclip" size={14} className="text-indigo-600" />
                            <a
                              href={mySubmission.FileUrl || '#'}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="text-indigo-600 hover:underline font-semibold"
                            >
                              {mySubmission.FileName}
                            </a>
                          </div>
                        )}

                        {mySubmission.Note && (
                          <p className="text-slate-600 italic">ข้อความถึงครู: "{mySubmission.Note}"</p>
                        )}

                        {mySubmission.Feedback && (
                          <div className="mt-2 pt-2 border-t border-slate-200">
                            <span className="font-bold text-emerald-700 block">คำติชมจากคุณครู:</span>
                            <p className="text-slate-700 mt-0.5">{mySubmission.Feedback}</p>
                          </div>
                        )}

                        <div className="pt-1">
                          <button
                            onClick={() => { setSubmittingAssignId(assign.AssignmentID); setStudentNote(mySubmission.Note || ''); }}
                            className="text-indigo-600 font-semibold hover:underline"
                          >
                            ส่งงานใหม่ / อัปเดตไฟล์
                          </button>
                        </div>
                      </div>
                    )}

                    {/* Student Submission Form (Accordion) */}
                    {submittingAssignId === assign.AssignmentID && (
                      <div className="bg-indigo-50/60 rounded-2xl p-5 border border-indigo-200 space-y-4">
                        <div className="flex items-center justify-between">
                          <h4 className="font-bold text-sm text-indigo-950 flex items-center gap-2">
                            <Icon name="FileUp" size={18} />
                            <span>ฟอร์มส่งงาน: {assign.Title}</span>
                          </h4>
                          <button onClick={() => setSubmittingAssignId(null)} className="text-slate-400 hover:text-slate-600">
                            <Icon name="X" size={18} />
                          </button>
                        </div>

                        <div className="space-y-3">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              แนบไฟล์ส่งงาน (PDF, รูปภาพ, หรือเอกสาร)
                            </label>
                            <input
                              type="file"
                              onChange={(e) => setUploadFile(e.target.files[0])}
                              className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer"
                            />
                            {uploadFile && (
                              <p className="text-[11px] text-emerald-700 font-medium mt-1">
                                เลือกไฟล์: {uploadFile.name} ({(uploadFile.size / 1024).toFixed(1)} KB)
                              </p>
                            )}
                          </div>

                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">
                              ข้อความเพิ่มเติมถึงครู (Optional)
                            </label>
                            <textarea
                              rows={2}
                              value={studentNote}
                              onChange={(e) => setStudentNote(e.target.value)}
                              placeholder="ระบุหมายเหตุหรือข้อความถึงคุณครู..."
                              className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
                            ></textarea>
                          </div>

                          <div className="flex justify-end gap-2 pt-2">
                            <button
                              type="button"
                              onClick={() => setSubmittingAssignId(null)}
                              className="px-3.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-200/60 rounded-xl"
                            >
                              ยกเลิก
                            </button>
                            <button
                              type="button"
                              disabled={isUploading}
                              onClick={() => handleStudentSubmit(assign)}
                              className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-1.5 transition"
                            >
                              <Icon name="Send" size={14} />
                              <span>{isUploading ? 'กำลังอัปโหลด...' : 'ยืนยันการส่งงาน'}</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* Modal Add Assignment */}
          {showAddModal && editingAssignment && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-lg font-bold text-slate-900">สร้างการบ้านใหม่</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveAssignmentSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">หัวข้อการบ้าน / ชื่องาน</label>
                    <input
                      type="text"
                      required
                      value={editingAssignment.Title}
                      onChange={(e) => setEditingAssignment({ ...editingAssignment, Title: e.target.value })}
                      placeholder="เช่น ใบงานที่ 1: ผังงานการแก้ปัญหา"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">คำอธิบายและคำสั่ง</label>
                    <textarea
                      rows={3}
                      required
                      value={editingAssignment.Description}
                      onChange={(e) => setEditingAssignment({ ...editingAssignment, Description: e.target.value })}
                      placeholder="ระบุข้อกำหนดในการทำใบงาน..."
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">คะแนนเต็ม</label>
                      <input
                        type="number"
                        required
                        min="1"
                        value={editingAssignment.MaxScore}
                        onChange={(e) => setEditingAssignment({ ...editingAssignment, MaxScore: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">กำหนดส่ง (Due Date)</label>
                      <input
                        type="datetime-local"
                        value={editingAssignment.DueDate}
                        onChange={(e) => setEditingAssignment({ ...editingAssignment, DueDate: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition"
                    >
                      บันทึกการบ้าน
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal View Submissions & Grade (Teacher View) */}
          {viewingAssignmentSubmissions && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl border border-slate-100 space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">ตรวจงาน: {viewingAssignmentSubmissions.Title}</h3>
                    <p className="text-xs text-slate-500">คะแนนเต็ม {viewingAssignmentSubmissions.MaxScore} คะแนน</p>
                  </div>
                  <button onClick={() => setViewingAssignmentSubmissions(null)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto custom-scroll space-y-3">
                  {submissions.filter(s => s.AssignmentID === viewingAssignmentSubmissions.AssignmentID).length === 0 ? (
                    <div className="py-12 text-center text-slate-400 text-sm">ยังไม่มีนักเรียนส่งงานในรายการนี้</div>
                  ) : (
                    <div className="divide-y divide-slate-100">
                      {submissions.filter(s => s.AssignmentID === viewingAssignmentSubmissions.AssignmentID).map(sub => (
                        <div key={sub.ID} className="py-3 flex flex-wrap items-center justify-between gap-3">
                          <div className="space-y-1">
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-sm text-slate-900">{sub.StudentName}</span>
                              <span className="text-xs font-mono text-slate-500">({sub.StudentID})</span>
                              <span className="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[11px]">{sub.Grade}</span>
                            </div>
                            <div className="text-xs text-slate-500 flex items-center gap-3">
                              <span>ส่งเมื่อ: {sub.SubmittedAt}</span>
                              {sub.FileName && (
                                <a
                                  href={sub.FileUrl}
                                  target="_blank"
                                  rel="noreferrer"
                                  className="text-indigo-600 hover:underline font-semibold flex items-center gap-1"
                                >
                                  <Icon name="ExternalLink" size={12} />
                                  <span>{sub.FileName}</span>
                                </a>
                              )}
                            </div>
                            {sub.Note && <p className="text-xs text-slate-600 italic">โน้ต: "{sub.Note}"</p>}
                            {sub.Feedback && (
                              <p className="text-xs text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-lg">
                                ความเห็นครู: {sub.Feedback}
                              </p>
                            )}
                          </div>

                          <div className="flex items-center gap-3">
                            <div className="text-right">
                              {sub.Score !== '' ? (
                                <span className="font-black text-indigo-600 text-base">
                                  {sub.Score} / {viewingAssignmentSubmissions.MaxScore}
                                </span>
                              ) : (
                                <span className="text-xs text-amber-600 font-bold bg-amber-50 px-2 py-1 rounded-md">ยังไม่ตรวจ</span>
                              )}
                            </div>
                            <button
                              onClick={() => {
                                setGradingSubmission(sub);
                                setScoreInput(sub.Score || '');
                                setFeedbackInput(sub.Feedback || '');
                              }}
                              className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow transition"
                            >
                              {sub.Score !== '' ? 'แก้ไขคะแนน' : 'ให้คะแนน'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal Grading Dialog */}
          {gradingSubmission && viewingAssignmentSubmissions && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">

    // --- Interactive Online Exam Taking Room ---
    function ExamTakingView({ exam, student, onComplete, onCancel }) {
      const questions = useMemo(() => {
        try { return JSON.parse(exam.QuestionsJSON || '[]'); } catch { return []; }
      }, [exam.QuestionsJSON]);

      const [answers, setAnswers] = useState({});
      const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(() => (parseInt(exam.TimeLimitMin) || 15) * 60);
      const timerRef = useRef(null);

      // Auto Countdown Timer
      useEffect(() => {
        timerRef.current = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleAutoSubmit();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerRef.current);
      }, []);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const calculateScore = () => {
        let score = 0;
        let total = 0;
        questions.forEach((q, idx) => {
          const qScore = parseInt(q.score) || 5;
          total += qScore;
          if (answers[idx] === q.answerIndex) {
            score += qScore;
          }
        });
        return { score, total };
      };

      const handleAutoSubmit = () => {
        Swal.fire({
          icon: 'warning',
          title: 'หมดเวลาทำข้อสอบ!',
          text: 'ระบบกำลังส่งกระดาษคำตอบของคุณโดยอัตโนมัติ...',
          timer: 2000,
          showConfirmButton: false
        }).then(() => {
          finishExam();
        });
      };

      const finishExam = () => {
        const { score, total } = calculateScore();
        const totalDuration = (parseInt(exam.TimeLimitMin) || 15) * 60;
        const timeSpent = totalDuration - timeLeft;

        onComplete({
          AttemptID: 'ATT_' + Date.now().toString().slice(-6),
          ExamID: exam.ExamID,
          CourseID: exam.CourseID,
          StudentID: student.StudentID,
          StudentName: student.Name,
          Score: String(score),
          TotalScore: String(total),
          SubmittedAt: new Date().toLocaleString('th-TH'),
          TimeSpentSec: String(timeSpent)
        });
      };

      const handleManualSubmit = () => {
        const answeredCount = Object.keys(answers).length;
        const totalCount = questions.length;

        Swal.fire({

    // --- Module 4: Teacher Evaluation (Anonymous Student Feedback) ---
    function EvaluationsView({ course, evaluations, currentUser, gasUrl, callGasApi, onSaveEvaluation }) {
      const isStudent = currentUser.role === 'student';

      const myEval = useMemo(() => {
        if (!isStudent) return null;
        return evaluations.find(ev => isSameStudentId(ev.StudentID, currentUser.user.StudentID) && ev.CourseID === course.CourseID);
      }, [evaluations, currentUser, isStudent, course.CourseID]);

      // Evaluation Form State
      const [ratings, setRatings] = useState({
        Clarity: 5,
        Engagement: 5,
        Materials: 5,
        Assessment: 5,
        Counseling: 5
      });
      const [comment, setComment] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const criteria = [
        { key: 'Clarity', title: '1. ความชัดเจนในการอธิบายเนื้อหา', desc: 'ครูอธิบายเนื้อหาได้เข้าใจง่าย มีตัวอย่างประกอบชัดเจน' },
        { key: 'Engagement', title: '2. กิจกรรมการเรียนรู้และการมีส่วนร่วม', desc: 'เปิดโอกาสให้นักเรียนซักถาม ร่วมแสดงความคิดเห็น และทำกิจกรรม' },
        { key: 'Materials', title: '3. คุณภาพของสื่อการสอนและใบงาน', desc: 'สไลด์ วิดีโอ และเอกสารประกอบมีความน่าสนใจ สอดคล้องกับบทเรียน' },
        { key: 'Assessment', title: '4. ความเป็นธรรมในการวัดและประเมินผล', desc: 'เกณฑ์การให้คะแนนชัดเจน มีความเหมาะสมและเป็นธรรม' },
        { key: 'Counseling', title: '5. การให้คำปรึกษาและคำแนะนำ', desc: 'ครูให้คำแนะนำและช่วยเหลือเมื่อนักเรียนมีข้อสงสัย' }
      ];

      const handleRatingChange = (key, val) => {
        setRatings(prev => ({ ...prev, [key]: val }));
      };

      const handleSubmitEvaluation = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);

        const values = Object.values(ratings);
        const overall = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);

        const evalRecord = {
          ID: 'EVAL_' + Date.now().toString().slice(-6),
          CourseID: course.CourseID,
          TeacherID: course.TeacherID,
          TeacherName: course.TeacherName,
          StudentID: currentUser.user.StudentID, // Recorded to prevent duplicate, kept hidden from teacher summary
          Clarity: String(ratings.Clarity),
          Engagement: String(ratings.Engagement),
          Materials: String(ratings.Materials),
          Assessment: String(ratings.Assessment),
          Counseling: String(ratings.Counseling),
          OverallScore: String(overall),
          Comment: comment.trim(),
          SubmittedAt: new Date().toLocaleString('th-TH')
        };

        if (gasUrl) {
          await callGasApi('submitEvaluation', { evaluation: evalRecord });
        }

        onSaveEvaluation(evalRecord);
        setIsSubmitting(false);

        Swal.fire({
          icon: 'success',
          title: 'ส่งแบบประเมินเรียบร้อย!',
          text: 'ข้อมูลการประเมินถูกส่งโดยไม่ระบุตัวตน ขอบคุณสำหรับความคิดเห็นครับ',
          confirmButtonColor: '#4f46e5'
        });
      };

      // Statistics calculations for Teacher / Admin dashboard
      const stats = useMemo(() => {
        if (evaluations.length === 0) return null;

        const count = evaluations.length;
        const sum = (key) => evaluations.reduce((acc, curr) => acc + (parseFloat(curr[key]) || 0), 0);

        return {
          count,
          avgOverall: (evaluations.reduce((acc, curr) => acc + (parseFloat(curr.OverallScore) || 0), 0) / count).toFixed(2),
          avgClarity: (sum('Clarity') / count).toFixed(2),
          avgEngagement: (sum('Engagement') / count).toFixed(2),
          avgMaterials: (sum('Materials') / count).toFixed(2),
          avgAssessment: (sum('Assessment') / count).toFixed(2),
          avgCounseling: (sum('Counseling') / count).toFixed(2)
        };
      }, [evaluations]);

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-xl font-bold text-slate-900">แบบประเมินประสิทธิภาพการสอน</h2>
            <p className="text-xs text-slate-500">
              การประเมินความพึงพอใจและประสิทธิภาพการจัดการเรียนการสอน รายวิชา {course.Name}
            </p>
          </div>

          {/* Student Form / Status */}
          {isStudent ? (
            myEval ? (
              <div className="bg-white rounded-3xl p-8 border border-slate-200 text-center space-y-4">
                <div className="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto">
                  <Icon name="CheckCircle" size={32} />
                </div>
                <h3 className="text-lg font-bold text-slate-900">คุณได้ทำแบบประเมินรายวิชานี้เรียบร้อยแล้ว</h3>
                <p className="text-xs text-slate-500 max-w-md mx-auto">
                  บันทึกข้อมูลเมื่อ {myEval.SubmittedAt} (ระบบบันทึกแบบไม่ระบุตัวตนเพื่อความโปร่งใส)
                </p>
              </div>
            ) : (
              <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                <div className="p-4 bg-indigo-50/70 border border-indigo-200 rounded-2xl flex items-start gap-3">
                  <Icon name="Shield" size={20} className="text-indigo-600 shrink-0 mt-0.5" />
                  <div className="text-xs text-indigo-900 leading-relaxed">
                    <b>การประเมินแบบไม่ระบุตัวตน (Anonymous):</b> ระบบจะใช้รหัสนักเรียนเพื่อป้องกันการประเมินซ้ำเท่านั้น โดยชื่อและรหัสนักเรียนของคุณจะไม่ปรากฏในรายงานสรุปของคุณครู
                  </div>
                </div>

                <form onSubmit={handleSubmitEvaluation} className="space-y-6">
                  <div className="space-y-4">
                    {criteria.map((item) => (
                      <div key={item.key} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                          <div>
                            <h4 className="font-bold text-sm text-slate-800">{item.title}</h4>
                            <p className="text-xs text-slate-500">{item.desc}</p>
                          </div>

                          {/* 5-Star Rating Buttons */}
                          <div className="flex items-center gap-1">
                            {[1, 2, 3, 4, 5].map((star) => (
                              <button
                                key={star}
                                type="button"
                                onClick={() => handleRatingChange(item.key, star)}
                                className={`p-1.5 transition ${
                                  star <= ratings[item.key] ? 'text-amber-400' : 'text-slate-300'
                                }`}
                              >
                                <Icon name="Star" size={24} className={star <= ratings[item.key] ? 'fill-amber-400' : ''} />
                              </button>
                            ))}
                            <span className="text-xs font-bold text-slate-700 ml-2 min-w-[20px]">
                              {ratings[item.key]} ดาว
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                      ข้อเสนอแนะเพิ่มเติมเพื่อการพัฒนาการสอน (Optional)
                    </label>
                    <textarea
                      rows={3}
                      value={comment}
                      onChange={(e) => setComment(e.target.value)}
                      placeholder="เช่น ครูสอนเข้าใจง่าย อยากให้มีกิจกรรมกลุ่มเพิ่มขึ้น..."
                      className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:border-indigo-500"
                    ></textarea>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-xs font-bold rounded-xl shadow-md transition"
                    >
                      {isSubmitting ? 'กำลังส่งข้อมูล...' : 'ส่งแบบประเมิน'}
                    </button>
                  </div>
                </form>
              </div>
            )
          ) : (
            /* Teacher / Admin Analytics Dashboard */
            <div className="space-y-6">
              {!stats ? (
                <div className="bg-white rounded-3xl p-12 text-center border border-slate-200 text-slate-400 text-sm">
                  ยังไม่มีนักเรียนส่งแบบประเมินในรายวิชานี้
                </div>
              ) : (
                <div className="space-y-6">
                  {/* Summary Metric Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">ผู้ร่วมประเมินทั้งหมด</span>
                      <span className="text-3xl font-black text-indigo-600 mt-2 block">{stats.count} คน</span>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">คะแนนเฉลี่ยรวม</span>
                      <div className="flex items-baseline gap-2 mt-2">
                        <span className="text-3xl font-black text-amber-500">{stats.avgOverall}</span>
                        <span className="text-xs text-slate-400">/ 5.0</span>
                      </div>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">การอธิบายเนื้อหา</span>
                      <span className="text-3xl font-black text-slate-800 mt-2 block">{stats.avgClarity}</span>
                    </div>

                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm">
                      <span className="text-xs font-bold text-slate-500 block">การมีส่วนร่วมในชั้นเรียน</span>
                      <span className="text-3xl font-black text-slate-800 mt-2 block">{stats.avgEngagement}</span>
                    </div>
                  </div>

                  {/* Rating Breakdown Bars */}
                  <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
                    <h3 className="font-bold text-sm text-slate-900">สรุปคะแนนประเมินแยกตามเกณฑ์ 5 ด้าน</h3>
                    <div className="space-y-3">
                      {[
                        { label: 'ความชัดเจนในการสอน (Clarity)', score: stats.avgClarity },
                        { label: 'การมีส่วนร่วมและกิจกรรม (Engagement)', score: stats.avgEngagement },
                        { label: 'คุณภาพสื่อการสอนและใบงาน (Materials)', score: stats.avgMaterials },
                        { label: 'ความเป็นธรรมในการวัดผล (Assessment)', score: stats.avgAssessment },
                        { label: 'การให้คำปรึกษาแก่นักเรียน (Counseling)', score: stats.avgCounseling }
                      ].map((bar, bIdx) => (
                        <div key={bIdx} className="space-y-1">
                          <div className="flex justify-between text-xs">
                            <span className="font-medium text-slate-700">{bar.label}</span>
                            <span className="font-bold text-indigo-600 font-mono">{bar.score} / 5.0</span>
                          </div>
                          <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                            <div
                              className="bg-indigo-600 h-full rounded-full transition-all duration-500"

                            ></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Anonymous Student Comments */}
                  <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-3">
                    <h3 className="font-bold text-sm text-slate-900">ข้อเสนอแนะและคำติชมจากนักเรียน (ไม่ระบุตัวตน)</h3>
                    <div className="divide-y divide-slate-100">
                      {evaluations.filter(e => e.Comment && e.Comment.trim() !== '').map((item, idx) => (

          )}

      const [importStatusText, setImportStatusText] = useState('');

          CreatedAt: new Date().toISOString().split('T')[0]
        });

        setEditingStudent({ ...st });
        setShowModal(true);

          title: 'ลบข้อมูลนักเรียน?',
          text: `ต้องการลบข้อมูลนักเรียนรหัส ${studentId} หรือไม่?`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'ยืนยันลบ',
          cancelButtonText: 'ยกเลิก',
          confirmButtonColor: '#ef4444'
        }).then((res) => {
          if (res.isConfirmed) {
            onDeleteStudent(studentId);
            Swal.fire({ icon: 'success', title: 'ลบข้อมูลเรียบร้อย', timer: 1200, showConfirmButton: false });
          }
        });
      };

      const handleSaveStudentSubmit = (e) => {
        e.preventDefault();
        onSaveStudent(editingStudent);
        setShowModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลนักเรียนสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      // Handle CSV File Reading with UTF-8
      const handleCsvFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setCsvFile(file);

        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
          if (lines.length <= 1) {
            Swal.fire({ icon: 'error', title: 'ไฟล์ว่างเปล่า', text: 'ไม่พบแถวข้อมูลในไฟล์ CSV' });
            return;
          }

          const headers = lines[0].split(',').map(h => h.trim().replace(/^["']|["']$/g, ''));
          const records = [];

          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
            if (cols.length >= 2) {
              const rec = {
                ID: 'S_' + Date.now() + '_' + i,
                StudentID: cols[0] || '',
                PIN: cols[1] || '1234',
                Name: cols[2] || '',
                Email: cols[3] || '',
                Grade: cols[4] || 'ม.3/1',
                AllowedCourses: cols[5] || courses.map(c => c.CourseID).join(','),
                CreatedAt: new Date().toISOString().split('T')[0]
              };
              if (rec.StudentID) records.push(rec);
            }
          }

          setParsedRecords(records);
        };
        reader.readAsText(file, 'UTF-8');
      };

      // High Performance Chunking Import Routine
      const executeChunkedImport = async () => {
        if (parsedRecords.length === 0) return;

        setIsImporting(true);
        setImportProgress(0);
        const CHUNK_SIZE = 50; // 50 students per chunk to avoid GAS execution timeouts
        const totalChunks = Math.ceil(parsedRecords.length / CHUNK_SIZE);
        let importedCount = 0;

        for (let i = 0; i < totalChunks; i++) {
          const chunk = parsedRecords.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE);
          setImportStatusText(`กำลังส่งข้อมูลชุดที่ ${i + 1} จาก ${totalChunks} (${chunk.length} คน)...`);

          if (gasUrl) {
            await callGasApi('batchSave', { sheetName: 'Students', records: chunk });
          }

          importedCount += chunk.length;
          const pct = Math.round((importedCount / parsedRecords.length) * 100);
          setImportProgress(pct);
        }

        onBatchImportSuccess(parsedRecords);

        setShowImportModal(false);

          text: `นำเข้าข้อมูลนักเรียนทั้งหมด ${importedCount} คน เรียบร้อยแล้ว`,

        });
      };
