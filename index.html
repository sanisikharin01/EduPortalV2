        e.preventDefault();
        onSaveTeacher(editingTeacher);
        setShowModal(false);
        Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลครูสำเร็จ', timer: 1200, showConfirmButton: false });
      };

      return (
        <div className="space-y-4 sm:space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">จัดการครูผู้สอน (Teachers)</h1>
              <p className="text-xs text-slate-500">จัดการข้อมูลประจำตัว อีเมล รหัสผ่าน และกลุ่มสาระการเรียนรู้</p>
            </div>

            <button
              onClick={handleOpenAdd}
              className="px-4 py-2.5 sm:py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-1.5 active:scale-95"
            >
              <Icon name="Plus" size={16} />
              <span>เพิ่มครูผู้สอนใหม่</span>
            </button>
          </div>

          {/* Mobile Teachers Card List */}
          <div className="md:hidden space-y-3">
            {teachers.map(teacher => (
              <div key={teacher.TeacherID} className="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm space-y-2.5">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <span className="font-mono font-extrabold text-xs text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-lg border border-indigo-100">
                      #{teacher.TeacherID}
                    </span>
                    <h3 className="font-extrabold text-sm text-slate-900 mt-1.5">{teacher.Name}</h3>
                    <p className="text-xs font-mono text-slate-500 mt-0.5">{teacher.Email}</p>
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button
                      onClick={() => handleOpenEdit(teacher)}
                      className="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 active:scale-95"
                      title="แก้ไข"
                    >
                      <Icon name="Edit" size={15} />
                    </button>
                    <button
                      onClick={() => handleDelete(teacher.TeacherID)}
                      className="p-2 bg-rose-50 hover:bg-rose-100 rounded-xl text-rose-600 active:scale-95"
                      title="ลบ"
                    >
                      <Icon name="Trash2" size={15} />
                    </button>
                  </div>
                </div>
                <div className="pt-2 border-t border-slate-100 text-[11px] text-slate-500">
                  {teacher.Department}
                </div>
              </div>
            ))}
          </div>

          {/* Desktop Teachers Table */}
          <div className="hidden md:block bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                <tr>
                  <th className="py-3 px-4">รหัสครู</th>
                  <th className="py-3 px-4">ชื่อ - นามสกุล</th>
                  <th className="py-3 px-4">อีเมล (สำหรับล็อกอิน)</th>
                  <th className="py-3 px-4">กลุ่มสาระการเรียนรู้</th>
                  <th className="py-3 px-4 text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {teachers.map(teacher => (
                  <tr key={teacher.TeacherID} className="hover:bg-slate-50">
                    <td className="py-3 px-4 font-mono font-bold text-indigo-700">{teacher.TeacherID}</td>
                    <td className="py-3 px-4 font-bold text-slate-800">{teacher.Name}</td>
                    <td className="py-3 px-4 font-mono text-slate-600">{teacher.Email}</td>
                    <td className="py-3 px-4 text-slate-600">{teacher.Department}</td>
                    <td className="py-3 px-4 text-center">
                      <div className="flex items-center justify-center gap-1">
                        <button
                          onClick={() => handleOpenEdit(teacher)}
                          className="p-1 hover:bg-slate-100 rounded text-slate-500 hover:text-slate-700"
                          title="แก้ไข"
                        >
                          <Icon name="Edit" size={15} />
                        </button>
                        <button
                          onClick={() => handleDelete(teacher.TeacherID)}
                          className="p-1 hover:bg-rose-50 rounded text-slate-400 hover:text-rose-600"
                          title="ลบ"
                        >
                          <Icon name="Trash2" size={15} />
                        </button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Modal Add/Edit Teacher */}
          {showModal && editingTeacher && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/50 backdrop-blur-sm">
              <div className="bg-white rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-6 shadow-2xl border-t sm:border border-slate-100 space-y-4 bottom-sheet pb-safe">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="text-lg font-bold text-slate-900">
                    {teachers.some(t => t.TeacherID === editingTeacher.TeacherID) ? 'แก้ไขข้อมูลครู' : 'เพิ่มครูผู้สอนใหม่'}
                  </h3>
                  <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="X" size={20} />
                  </button>
                </div>

                <form onSubmit={handleSaveSubmit} className="space-y-4">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">รหัสครู *</label>
                      <input
                        type="text"
                        required
                        value={editingTeacher.TeacherID}
                        onChange={(e) => setEditingTeacher({ ...editingTeacher, TeacherID: e.target.value })}
                        placeholder="เช่น T103"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">รหัสผ่านเข้าใช้งาน *</label>
                      <input
                        type="text"
                        required
                        value={editingTeacher.Password}
                        onChange={(e) => setEditingTeacher({ ...editingTeacher, Password: e.target.value })}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-mono focus:outline-none focus:border-indigo-500"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ - นามสกุลครู *</label>
                    <input
                      type="text"
                      required
                      value={editingTeacher.Name}
                      onChange={(e) => setEditingTeacher({ ...editingTeacher, Name: e.target.value })}
                      placeholder="เช่น ครูสมศักดิ์ สุขใจ"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">อีเมลโรงเรียน (Email) *</label>
                    <input
                      type="email"
                      required
                      value={editingTeacher.Email}
                      onChange={(e) => setEditingTeacher({ ...editingTeacher, Email: e.target.value })}
                      placeholder="เช่น somsak@school.ac.th"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">กลุ่มสาระการเรียนรู้</label>
                    <input
                      type="text"
                      value={editingTeacher.Department}
                      onChange={(e) => setEditingTeacher({ ...editingTeacher, Department: e.target.value })}
                      placeholder="เช่น กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button
                      type="button"
                      onClick={() => setShowModal(false)}
                      className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md transition"
                    >
                      บันทึกข้อมูลครู
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Module 5: Announcements Management & View ---
    function AnnouncementsView({ settings, currentUser, onSaveAnnouncement }) {
      const currentAnn = useMemo(() => {
        const item = settings.find(s => s.SettingKey === 'Announcement');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return null; }
        }
        return { enabled: true, title: 'ไม่มีประกาศในขณะนี้', content: '', badge: 'ประกาศทั่วไป' };
      }, [settings]);

      const [formData, setFormData] = useState(currentAnn);

      useEffect(() => {
        setFormData(currentAnn);
      }, [currentAnn]);

      const handleSave = (e) => {
        e.preventDefault();
        onSaveAnnouncement(formData);
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">ประกาศโรงเรียน (School Announcements)</h1>
            <p className="text-xs text-slate-500">ข่าวสาร กำหนดการ และข้อความแจ้งเตือนป๊อปอัปสำหรับนักเรียนและครู</p>
          </div>

          {/* Live Preview Card */}
          <div className="bg-gradient-to-r from-indigo-900 to-slate-900 rounded-3xl p-6 text-white shadow-xl space-y-3">
            <div className="flex items-center justify-between">
              <span className="px-3 py-1 bg-white/20 backdrop-blur-md text-amber-300 rounded-full text-xs font-bold flex items-center gap-1.5">
                <Icon name="Bell" size={14} />
                {formData.badge || 'ประกาศ'}
              </span>
              <span className={`text-xs px-2.5 py-0.5 rounded-full font-bold ${
                formData.enabled ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
              }`}>
                {formData.enabled ? 'สถานะ: เปิดแสดงผลป๊อปอัป' : 'สถานะ: ปิดการแสดงผล'}
              </span>
            </div>

            <h3 className="text-xl font-bold tracking-tight">{formData.title}</h3>
            <p className="text-slate-300 text-xs sm:text-sm whitespace-pre-line leading-relaxed">
              {formData.content}
            </p>
          </div>

          {/* Admin Edit Form */}
          {currentUser.role === 'admin' && (
            <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
              <h3 className="font-bold text-sm text-slate-900">แก้ไขเนื้อหาประกาศ (Admin Settings)</h3>

              <form onSubmit={handleSave} className="space-y-4">
                <div className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    id="ann_enabled"
                    checked={formData.enabled}
                    onChange={(e) => setFormData({ ...formData, enabled: e.target.checked })}
                    className="w-4 h-4 text-indigo-600 rounded"
                  />
                  <label htmlFor="ann_enabled" className="text-xs font-bold text-slate-700 cursor-pointer">
                    เปิดแสดงผลป๊อปอัปอัตโนมัติเมื่อผู้ใช้เข้าสู่ระบบ
                  </label>
                </div>

                <div className="grid grid-cols-3 gap-3">
                  <div className="col-span-2">
                    <label className="block text-xs font-bold text-slate-700 mb-1">หัวข้อประกาศ</label>
                    <input
                      type="text"
                      required
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">ป้ายกำกับ (Badge)</label>
                    <input
                      type="text"
                      value={formData.badge}
                      onChange={(e) => setFormData({ ...formData, badge: e.target.value })}
                      placeholder="เช่น ประกาศด่วน"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เนื้อหาประกาศ</label>
                  <textarea
                    rows={4}
                    required
                    value={formData.content}
                    onChange={(e) => setFormData({ ...formData, content: e.target.value })}
                    className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                  ></textarea>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    type="submit"
                    className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    บันทึกการตั้งค่าประกาศ
                  </button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // --- Admin Module: Settings & Backend Control Center ---
    function SettingsView({ settings, gasUrl, setGasUrl, onPing, onSetup, onPull, onPush, onSaveSetting }) {
      const [urlInput, setUrlInput] = useState(gasUrl);
      const [folderIdInput, setFolderIdInput] = useState(() => {
        const item = settings.find(s => s.SettingKey === 'DriveFolderID');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return item.SettingValueJSON; }
        }
        return '';
      });

      const [adminPassInput, setAdminPassInput] = useState(() => {
        const item = settings.find(s => s.SettingKey === 'AdminPassword');
        if (item && item.SettingValueJSON) {
          try { return JSON.parse(item.SettingValueJSON); } catch { return item.SettingValueJSON; }
        }
        return 'admin1234';
      });

      const handleSaveGeneral = (e) => {
        e.preventDefault();
        setGasUrl(urlInput.trim());

        onSaveSetting({
          SettingKey: 'DriveFolderID',
          SettingValueJSON: JSON.stringify(folderIdInput.trim()),
          UpdatedAt: new Date().toISOString()
        });

        onSaveSetting({
          SettingKey: 'AdminPassword',
          SettingValueJSON: JSON.stringify(adminPassInput.trim()),
          UpdatedAt: new Date().toISOString()
        });

        Swal.fire({
          icon: 'success',
          title: 'บันทึกการตั้งค่าระบบเรียบร้อย',
          timer: 1500,
          showConfirmButton: false
        });
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="text-2xl font-black text-slate-900 tracking-tight">ตั้งค่าระบบและศูนย์ควบคุม (System Settings)</h1>
            <p className="text-xs text-slate-500">การเชื่อมต่อ Google Apps Script, โฟลเดอร์ Google Drive และความปลอดภัย</p>
          </div>

          {/* Database Control Buttons Panel */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="Database" size={18} className="text-indigo-600" />
              <span>ศูนย์ควบคุมฐานข้อมูล Google Sheets (Database Control Panel)</span>
            </h3>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              <button
                type="button"
                onClick={onPing}
                className="p-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-2xl border border-indigo-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="RefreshCw" size={16} />
                  <span>[1] ทดสอบเชื่อมต่อ (Ping)</span>
                </div>
                <p className="text-[11px] text-indigo-900/70">ตรวจสอบความพร้อมของ GAS Web App</p>
              </button>

              <button
                type="button"
                onClick={onSetup}
                className="p-4 bg-amber-50 hover:bg-amber-100 text-amber-800 rounded-2xl border border-amber-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="Database" size={16} />
                  <span>[2] สร้าง 10 Sheet (Setup)</span>
                </div>
                <p className="text-[11px] text-amber-900/70">สร้างและจัดหัวตารางให้อัตโนมัติ</p>
              </button>

              <button
                type="button"
                onClick={onPull}
                className="p-4 bg-sky-50 hover:bg-sky-100 text-sky-700 rounded-2xl border border-sky-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="DownloadCloud" size={16} />
                  <span>[3] ดึงข้อมูลสู่ระบบ (Pull)</span>
                </div>
                <p className="text-[11px] text-sky-900/70">อ่านข้อมูลล่าสุดจาก Google Sheets</p>
              </button>

              <button
                type="button"
                onClick={onPush}
                className="p-4 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-2xl border border-emerald-200 text-left transition space-y-1"
              >
                <div className="flex items-center gap-2 font-bold text-xs">
                  <Icon name="UploadCloud" size={16} />
                  <span>[4] ส่งข้อมูลขึ้น Sheets (Push)</span>
                </div>
                <p className="text-[11px] text-emerald-900/70">บันทึกข้อมูลในเครื่องขึ้นชีตทั้งหมด</p>
              </button>
            </div>
          </div>

          {/* Connection Parameters Form */}
          <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h3 className="font-bold text-sm text-slate-900 flex items-center gap-2">
              <Icon name="Link" size={18} className="text-indigo-600" />
              <span>พารามิเตอร์การเชื่อมต่อ (Backend Credentials)</span>
            </h3>

            <form onSubmit={handleSaveGeneral} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Google Apps Script Web App URL
                </label>
                <input
                  type="url"
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
                <p className="text-[11px] text-slate-400 mt-1">
                  * ต้อง Deploy สคริปต์ Code.gs แบบ "Web App" โดยตั้งค่า Execute as: Me และ Who has access: Anyone
                </p>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  Google Drive Folder ID (สำหรับจัดเก็บไฟล์การบ้านนักเรียน)
                </label>
                <input
                  type="text"
                  value={folderIdInput}
                  onChange={(e) => setFolderIdInput(e.target.value)}
                  placeholder="เช่น 1A2b3C4d5E... (หากเว้นว่าง ระบบจะสร้างโฟลเดอร์ EduPortal_Submissions ให้อัตโนมัติ)"
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">
                  รหัสผ่านผู้ดูแลระบบ (Admin Password)
                </label>
                <input
                  type="text"
                  required
                  value={adminPassInput}
                  onChange={(e) => setAdminPassInput(e.target.value)}
                  className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="flex justify-end pt-2">
                <button
                  type="submit"
                  className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition"
                >
                  บันทึกการตั้งค่าระบบ
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Mount React Application ---
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<EduPortalApp />);
  </script>
</body>
</html>
